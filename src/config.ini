[paths]
raw_data_path = data/telco_churn.csv
log_path = logs/app.log
save_dir = save

[pipeline]
target_col = Churn
preprocessing_mode = rerun
feature_engineer_mode = rerun
model_mode = rerun
test_size = 0.2
random_state = 42

[training]
# Metric used to select the best model: accuracy | precision | recall | f1 | roc_auc
selection_metric = roc_auc
# Customers with a churn probability >= this threshold are predicted to churn
decision_threshold = 0.5